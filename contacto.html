<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto – Catherine Design</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="navbar-container"></div>

    <section id="contacto-page">

        <!-- Decoración de fondo -->
        <div class="cp-deco cp-deco--1"></div>
        <div class="cp-deco cp-deco--2"></div>

        <div class="cp-inner">

            <!-- Columna izquierda: info -->
            <div class="cp-left">

                <p class="cp-eyebrow">¿Tienes un proyecto? 👀</p>

                <h1 class="cp-title">
                    Hablemos y<br>
                    <span>hagámoslo</span><br>
                    realidad.
                </h1>

                <p class="cp-subtitle">
                    Me encantaría escuchar tu idea y explorar
                    juntos cómo darle vida con diseño y detalle.
                </p>

                <!-- Datos de contacto -->
                <div class="cp-data">

                    <a href="mailto:catherine.guerrero64@gmail.com" class="cp-data-item">
                        <div class="cp-data-icon">
                            <i class="fa-regular fa-envelope"></i>
                        </div>
                        <div class="cp-data-text">
                            <span class="cp-data-label">Correo</span>
                            <span class="cp-data-value">catherine.guerrero64@gmail.com</span>
                        </div>
                    </a>

                    <a href="https://wa.me/573004200338" target="_blank" class="cp-data-item">
                        <div class="cp-data-icon">
                            <i class="fa-brands fa-whatsapp"></i>
                        </div>
                        <div class="cp-data-text">
                            <span class="cp-data-label">WhatsApp</span>
                            <span class="cp-data-value">+57 300 420 0338</span>
                        </div>
                    </a>

                    <a href="https://www.instagram.com/luisac.guerrero_/" target="_blank" class="cp-data-item">
                        <div class="cp-data-icon">
                            <i class="fa-brands fa-instagram"></i>
                        </div>
                        <div class="cp-data-text">
                            <span class="cp-data-label">Instagram</span>
                            <span class="cp-data-value">@luisac.guerrero_</span>
                        </div>
                    </a>

                    <a href="https://www.behance.net/catheriguerrer3" target="_blank" class="cp-data-item">
                        <div class="cp-data-icon">
                            <i class="fa-brands fa-behance"></i>
                        </div>
                        <div class="cp-data-text">
                            <span class="cp-data-label">Behance</span>
                            <span class="cp-data-value">catheriguerrer3</span>
                        </div>
                    </a>

                </div>

            </div>

            <!-- Columna derecha: formulario -->
            <div class="cp-right">

                <div class="cp-form-card">

                    <h2 class="cp-form-title">Envíame un mensaje</h2>

                    <div class="cp-form">

                        <div class="cp-field">
                            <label>Nombre</label>
                            <input type="text" placeholder="Tu nombre">
                        </div>

                        <div class="cp-field">
                            <label>Correo electrónico</label>
                            <input type="email" placeholder="tucorreo@email.com">
                        </div>

                        <div class="cp-field">
                            <label>Asunto</label>
                            <input type="text" placeholder="¿Sobre qué quieres hablar?">
                        </div>

                        <div class="cp-field">
                            <label>Mensaje</label>
                            <textarea placeholder="Cuéntame sobre tu proyecto, idea o consulta..."></textarea>
                        </div>

                        <button class="cp-submit">
                            Enviar mensaje
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <div id="footer-container"></div>
    <script src="script.js"></script>
</body>
</html>
